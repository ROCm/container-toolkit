#
# Main branch security scan: scans the whole repository on every push to
# main and every night, and pushes SARIF findings to the repository's
# code-scanning Security tab. Complements `pr-security-scan.yml`, which
# scans only what changed in a pull request.
#
# Every event uses scan_mode `all`. Code scanning treats each upload as the
# complete result for its category, so a partial scan of main would close
# every alert outside the files it covered.
#
# `security-events: write` is granted on the `uses:` job itself, not just
# the top-level `permissions:` block above it, since a `permissions:`
# block (wherever declared) implicitly zeroes out anything it doesn't
# list.

name: Security scan (main)

on:
  push:
    branches: [main]
  # Run every day at 02:17 UTC, so new advisories surface without a commit.
  # Runs scheduled on the hour are more likely to be delayed or dropped.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight push scan. Scheduled and manual runs
# have their own groups and are never cancelled by a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  security:
    name: Security scan
    # Only the job that uploads SARIF gets write access to code scanning.
    permissions:
      contents: read
      security-events: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@35d3060c4b2ed48f950f85bd414a1302a431fc0b # v1.0.8
    with:
      scan_mode: all
      report_formats: sarif
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
