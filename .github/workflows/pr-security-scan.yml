#
# Pre-commit security gate: fast, PR-side security scanners that run on
# every pull request. The security counterpart to `pre-commit.yml`. The
# set of scanners lives in `security-baseline.yml`, so scanners coming
# online are picked up here without touching this file.
#
# Requests SARIF reports: findings go to code scanning and show up as
# annotations on the pull request. GitHub accepts SARIF uploads from fork
# pull requests in public repositories even though their token is
# read-only. On pull requests from branches of this repository, the
# baseline also emits JSON reports for its findings comment; those reach
# the job log, job summary and artifacts. See nightly-security-scan.yml for
# the full-repository scan.

name: Security scan (PR)

on:
  pull_request:
    # Spelled out the default to avoid confusion.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    # `security-events: write` uploads SARIF to code scanning. `actions: read`
    # and `pull-requests: write` let the baseline post its findings comment
    # on pull requests from branches of this repository.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@f92f9387d10fe91a0293762bdcefd3ba012a827b # v1.0.7
    with:
      report_formats: sarif
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
