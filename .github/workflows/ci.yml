name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Build container-toolkit
      run: make container-toolkit
    
    - name: Build container-toolkit-ctk
      run: make container-toolkit-ctk
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          bin/deb/amd-container-runtime
          bin/deb/amd-ctk
        retention-days: 7

  test:
    runs-on: ubuntu-24.04
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: bin/deb/
    
    - name: Make binaries executable
      run: chmod +x bin/deb/amd-ctk bin/deb/amd-container-runtime
    
    - name: Run tests
      run: make test

  package-test:
    runs-on: ubuntu-24.04
    needs: build
    name: package-test (${{ matrix.os }}, driver ${{ matrix.driver }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, rhel-9, rhel-10]
        driver: [none, installed]
        include:
          - os: ubuntu-22.04
            image: ubuntu:22.04
            package: deb
            bin_dir: deb
            codename: jammy
          - os: ubuntu-24.04
            image: ubuntu:24.04
            package: deb
            bin_dir: deb
            codename: noble
          - os: ubuntu-26.04
            image: ubuntu:26.04
            package: deb
            bin_dir: deb
            codename: resolute
          - os: rhel-9
            image: registry.access.redhat.com/ubi9/ubi
            package: rpm
            bin_dir: rpmbuild
            el: "9"
          - os: rhel-10
            image: registry.access.redhat.com/ubi10/ubi
            package: rpm
            bin_dir: rpmbuild
            el: "10"
    container: ${{ matrix.image }}

    steps:
    - name: Install RPM packaging dependencies
      if: matrix.package == 'rpm'
      run: dnf install -y git jq make rpm-build

    - name: Install Debian packaging dependencies
      if: matrix.package == 'deb'
      run: apt-get update && apt-get install -y git jq make

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: bin/${{ matrix.bin_dir }}/

    - name: Make binaries executable
      run: chmod +x bin/${{ matrix.bin_dir }}/amd-ctk bin/${{ matrix.bin_dir }}/amd-container-runtime

    - name: Install amdgpu driver packages
      if: matrix.driver == 'installed'
      env:
        UBUNTU_CODENAME: ${{ matrix.codename }}
        EL_VERSION: ${{ matrix.el }}
      run: bash tests/install-amdgpu-driver.sh "${{ matrix.package }}"

    - name: Install package and check the CLI
      env:
        UBUNTU_VERSION: ${{ matrix.codename }}
        EXPECT_DRIVER: ${{ matrix.driver }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        bash tests/package-install.sh "${{ matrix.package }}"
