name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Build container-toolkit
      run: make container-toolkit
    
    - name: Build container-toolkit-ctk
      run: make container-toolkit-ctk
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          bin/deb/amd-container-runtime
          bin/deb/amd-ctk
        retention-days: 7

  test:
    runs-on: ubuntu-24.04
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: bin/deb/
    
    - name: Make binaries executable
      run: chmod +x bin/deb/amd-ctk bin/deb/amd-container-runtime
    
    - name: Run tests
      run: make test

  package-test:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        include:
          - package: rpm
            image: almalinux:9
          - package: deb
            image: ubuntu:24.04
    container: ${{ matrix.image }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: bin/rpmbuild/

    - name: Make binaries executable
      run: chmod +x bin/rpmbuild/amd-ctk bin/rpmbuild/amd-container-runtime

    - name: Install RPM packaging dependencies
      if: matrix.package == 'rpm'
      run: dnf install -y rpm-build jq

    - name: Install Debian packaging dependencies
      if: matrix.package == 'deb'
      run: apt-get update && apt-get install -y jq

    - name: Install package without a GPU driver
      run: bash tests/package-install.sh "${{ matrix.package }}"
