name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    
    - name: Build container-toolkit
      run: make container-toolkit
    
    - name: Build container-toolkit-ctk
      run: make container-toolkit-ctk
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binaries
        path: |
          bin/deb/amd-container-runtime
          bin/deb/amd-ctk
        retention-days: 7

  test:
    runs-on: ubuntu-24.04
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: binaries
        path: bin/deb/
    
    - name: Make binaries executable
      run: chmod +x bin/deb/amd-ctk bin/deb/amd-container-runtime
    
    - name: Run tests
      run: make test

  package-test:
    runs-on: ubuntu-24.04
    needs: build
    name: package-test (${{ matrix.os }}, driver ${{ matrix.driver }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, rhel-9, rhel-10]
        driver: [none, installed]
        include:
          - os: ubuntu-22.04
            image: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
            package: deb
            bin_dir: deb
            codename: jammy
          - os: ubuntu-24.04
            image: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
            package: deb
            bin_dir: deb
            codename: noble
          - os: ubuntu-26.04
            image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
            package: deb
            bin_dir: deb
            codename: resolute
          - os: rhel-9
            image: registry.access.redhat.com/ubi9/ubi:latest@sha256:5858f9ace07316e3b12caab62f6c2481a5030bb6bafdca5a9ea324c321ef36df
            package: rpm
            bin_dir: rpmbuild
            el: "9"
          - os: rhel-10
            image: registry.access.redhat.com/ubi10/ubi:latest@sha256:27e14f4987d7abe56664d7e1b1dddcd0226d4ca593da5726f0f65697a17d0fee
            package: rpm
            bin_dir: rpmbuild
            el: "10"
    container: ${{ matrix.image }}

    steps:
    - name: Install RPM packaging dependencies
      if: matrix.package == 'rpm'
      run: dnf install -y git jq make rpm-build

    - name: Install Debian packaging dependencies
      if: matrix.package == 'deb'
      run: apt-get update && apt-get install -y git jq make

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: binaries
        path: bin/${{ matrix.bin_dir }}/

    - name: Make binaries executable
      run: chmod +x bin/${{ matrix.bin_dir }}/amd-ctk bin/${{ matrix.bin_dir }}/amd-container-runtime

    - name: Install amdgpu driver packages
      if: matrix.driver == 'installed'
      env:
        UBUNTU_CODENAME: ${{ matrix.codename }}
        EL_VERSION: ${{ matrix.el }}
      run: bash tests/install-amdgpu-driver.sh "${{ matrix.package }}"

    - name: Install package and check the CLI
      env:
        UBUNTU_VERSION: ${{ matrix.codename }}
        EXPECT_DRIVER: ${{ matrix.driver }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        bash tests/package-install.sh "${{ matrix.package }}"
