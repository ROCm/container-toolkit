#
# Nightly security scan: scans the whole repository every night and pushes
# SARIF findings to the repository's code-scanning Security tab.
# Complements `pr-security-scan.yml`, which scans only what changed in a
# pull request.
#
# `security-events: write` is granted on the `uses:` job itself, not just
# the top-level `permissions:` block above it, since a `permissions:`
# block (wherever declared) implicitly zeroes out anything it doesn't
# list.

name: Security scan (Nightly)

on:
  # Run every day at 02:17 UTC. Runs scheduled on the hour are more likely
  # to be delayed or dropped.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    # Only the job that uploads SARIF gets write access to code scanning.
    permissions:
      contents: read
      security-events: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@f92f9387d10fe91a0293762bdcefd3ba012a827b # v1.0.7
    with:
      scan_mode: all
      report_formats: sarif
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
