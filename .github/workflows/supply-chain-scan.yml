#
# Supply chain scan: checks the Go module and the pip requirement files
# against OSV, which includes OpenSSF malicious package reports (MAL-*)
# alongside CVEs. Dependabot alerts only look at the default branch after
# merge; this gates every pull request before a compromised or vulnerable
# dependency lands, and rechecks main nightly as new reports come in.
#
# Both scanners write SARIF to code scanning and keep findings out of the
# job log. osv-scanner fails the job on any finding; suppress a finding
# only through an osv-scanner.toml entry with a reason. govulncheck adds
# call-path detail for Go. Its job passes regardless of findings, but code
# scanning still flags reachable vulnerabilities on the pull request.

name: Supply chain scan

on:
  pull_request:
  push:
    branches: [main]
  # Daily at 02:15 UTC, so newly published advisories and malicious
  # package reports surface without waiting for a commit.
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv-scanner:
    name: Scan dependencies (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs the binary directly rather than through google/osv-scanner-action:
      # the action references its image by a mutable tag and its wrapper hides
      # the exit code. Exit code 1 means findings; anything else means the scan
      # did not complete, and its empty SARIF must not close open alerts.
      # The workspace is mounted at its runner path because osv-scanner writes
      # absolute paths, and upload-sarif only relativizes those under the
      # workspace. Go call analysis is off so that vulnerabilities it deems
      # unreachable still fail the job; govulncheck reports reachability.
      - name: Run osv-scanner
        id: osv
        env:
          OSV_IMAGE: ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 # v2.7.0
        run: |
          rc=0
          docker run --rm -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            --entrypoint /root/osv-scanner "${OSV_IMAGE}" \
            scan source --no-call-analysis=go --format=sarif --output-file=osv.sarif --recursive ./ || rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          exit "${rc}"

      - name: Upload SARIF report to code scanning
        if: ${{ !cancelled() && (steps.osv.outputs.rc == '0' || steps.osv.outputs.rc == '1') }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  govulncheck:
    name: Scan Go call paths (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # SARIF mode exits 0 even when vulnerable code is reachable, so a
      # failure here means the scan itself broke.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -format sarif ./... > govulncheck.sarif

      - name: Upload SARIF report to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
