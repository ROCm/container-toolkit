# Dependabot version updates. See
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directory: "/"
    schedule:
      interval: "daily"
      # Wait a week before adopting newly released action versions.
    cooldown:
      default-days: 7
      exclude:
        - "ROCm/rocm-security-gh*"
    groups:
      rocm-security-gh:
        patterns: ["ROCm/rocm-security-gh*"]
      github-actions:
        patterns: ["*"]

  # Security updates are not subject to the cooldown or the weekly schedule.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories:
      - "/docs/sphinx"
      - "/tests/enroot"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
